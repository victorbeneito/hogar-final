services:
  mi_tienda:
    image: mariadb:10.11
    container_name: mi_tienda
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_tienda
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
    volumes:
      - mysql_data:/var/lib/mysql  # ← Volumen nombrado, NO ruta absoluta

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mi_tienda
    depends_on:
      - mi_tienda

volumes:
  mysql_data:  # ← Declarar el volumen aquí
