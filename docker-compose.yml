services:
  mi_tienda:
    image: mariadb:10.11
    container_name: mi_tienda
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_tienda
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
    command:
      - "--innodb-use-native-aio=0"
      - "--innodb-flush-log-at-trx-commit=2"
      - "--innodb-flush-method=O_DSYNC"
      - "--sync-binlog=0"
      - "--skip-name-resolve"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mi_tienda
    depends_on:
      - mi_tienda

volumes:
  mysql_data:
