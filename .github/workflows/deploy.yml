name: Deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Plesk deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --insecure \
            -X POST \
            "https://elhogardetusuenos.com:${{ secrets.PLESK_WEBHOOK_PASSWORD }}@ns3.ev22.com:8443/modules/git/public/web-hook.php?uuid=8f183662-70dd-2588-9fa2-fd6c39ba30fe"
